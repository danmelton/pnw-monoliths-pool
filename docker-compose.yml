services:
  app1:
    build: ./app1
    command: ["node", "--watch-path=src", "src/index.ts"]
    volumes:
      - ./app1/src:/app/src
    ports:
      - "127.0.0.1:3000:3000"
  app2:
    build: ./app2
    command: ["uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./app2:/app
    ports:
      - "127.0.0.1:8000:8000"
