<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNW App Pool Monolith Page</title>
  <!-- CSS used PICO CSS https://picocss.com/ Nov 8 2026 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <style>
    pre { height: 360px; overflow: auto; margin: 0; padding: 1rem; }
    textarea[data-out="code"] { height: 360px; margin: 0; padding: 1rem; font-family: var(--pico-font-family-monospace); font-size: .875rem; white-space: pre; resize: vertical; }
    h6 button { padding: 0 .5rem; margin-left: .5rem; font-size: .75rem; }
    .ok { color: var(--pico-ins-color); }
    .err { color: var(--pico-del-color); }
  </style>
</head>
<body>
  <main class="container">
    <h1>App pool test page</h1>
    <!-- The service panels are built from SERVICES in the script below. -->
  </main>

  <script>
    // =========================================================================
    // ADD YOUR SERVICE
    //
    // 1. Write a request function in "Request functions" below. Copy
    //    getUsernames. Return { status, type, body }; type is the response's
    //    Content-Type and shows next to the status (leave it out to hide it).
    //
    // 2. Add an entry to SERVICES (below the functions):
    //      title      shown on the panel's heading
    //      urlName    name of the URL constant in the panel's code, e.g. 'MYSERVICE_URL'
    //      url        where the service runs (its port in docker-compose.yml)
    //      functions  the request functions to copy into the panel's code
    //      call       the last lines of the code: the call that runs. Must `return`
    //                 the result. Put other calls to try in comments above it.
    //
    // 3. Your service must allow CORS, or the browser blocks the response.
    //    See the middleware near the top of username/src/index.ts (Express)
    //    or app2/main.py (FastAPI).
    //
    // Reload the page and your panel appears. You shouldn't need to edit
    // anything below "Page wiring".
    // =========================================================================

    // ---- Add your functions here ----

    // usernames only function call
    async function getUsernames(count) {
      const url = `${USERNAME_URL}/usernames?count=${count}`;
      const res = await fetch(url);
      const body = await res.json();
      return { status: res.status, type: res.headers.get('Content-Type'), body };
    }

    // Shared by app1 and app2: they have the same items API, so the URL is a parameter.
    // If you have multiple rest patterns, you could combine them like so (see the method is post or put area)
    async function callItems(baseUrl, method, id, name) {
      const url = id ? `${baseUrl}/items/${id}` : `${baseUrl}/items`;
      const options = { method };
      if (method === 'POST' || method === 'PUT') {
        options.headers = { 'Content-Type': 'application/json' };
        options.body = JSON.stringify({ name });
      }
      const res = await fetch(url, options);
      const body = await res.json();
      return { status: res.status, type: res.headers.get('Content-Type'), body };
    }


    // Image service: upload a JPG or PNG, then retrieve or delete it by its 5-digit imageID.
    // With no file, uploadImage draws a 1200x800 test PNG in the browser and uploads that.
    // The page remembers the last upload's imageID (window.lastImageID), so getImage()
    // and deleteImage() with no ID use it.
    async function uploadImage(file) {
      if (!file) {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 800;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'purple';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const blob = await new Promise(done => canvas.toBlob(done, 'image/png'));
        file = new File([blob], 'test.png', { type: 'image/png' });
      }
      const form = new FormData();
      form.append('file', file);
      const res = await fetch(`${IMAGE_URL}/images`, { method: 'POST', body: form });
      const body = await res.json();
      if (res.ok) window.lastImageID = body.imageID;
      return { status: res.status, type: res.headers.get('Content-Type'), body };
    }

    // An image comes back as its size in bytes and pixels; an error comes back as its JSON.
    async function getImage(id = window.lastImageID) {
      if (!id) return 'No image yet: do step 1 (upload) first, or pass an ID like getImage(\'12345\').';
      const res = await fetch(`${IMAGE_URL}/images/${id}`);
      const type = res.headers.get('Content-Type');
      if (!res.ok) return { status: res.status, type, body: await res.json() };
      const blob = await res.blob();
      const img = await createImageBitmap(blob);
      return { status: res.status, type, body: { bytes: blob.size, width: img.width, height: img.height } };
    }

    async function deleteImage(id = window.lastImageID) {
      if (!id) return 'No image yet: do step 1 (upload) first, or pass an ID like deleteImage(\'12345\').';
      const res = await fetch(`${IMAGE_URL}/images/${id}`, { method: 'DELETE' });
      return { status: res.status, type: res.headers.get('Content-Type'), body: await res.json() };
    }

    // CSV exporter: POST a body to /export. A string is sent as is (to test bad JSON).
    // A CSV comes back as a list of its lines; a 400 comes back as its JSON error.
    // (The browser can't read Content-Disposition unless the service exposes it in CORS.)
    async function exportCsv(body) {
      const res = await fetch(`${CSV_EXPORTER_URL}/export`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: typeof body === 'string' ? body : JSON.stringify(body),
      });
      const isCsv = (res.headers.get('Content-Type') || '').includes('text/csv');
      const result = isCsv ? (await res.text()).replace(/\r\n$/, '').split('\r\n') : await res.json();
      return { status: res.status, type: res.headers.get('Content-Type'), body: result };
    }

    const itemsCalls = urlName => `return callItems(${urlName}, 'GET', null, null)`;

    const SERVICES = [
      {
        title: 'Username generator',
        urlName: 'USERNAME_URL',
        url: 'http://localhost:3001',
        functions: [getUsernames],
        call: `// count: 1 to 100
return getUsernames(10);`,
      },
      {
        title: 'app1 – Express items',
        urlName: 'APP1_URL',
        url: 'http://localhost:3000',
        functions: [callItems],
        call: itemsCalls('APP1_URL'),
      },
      {
        title: 'app2 – FastAPI items',
        urlName: 'APP2_URL',
        url: 'http://localhost:8000',
        functions: [callItems],
        call: itemsCalls('APP2_URL'),
      },
      {
        title: 'Image service',
        urlName: 'IMAGE_URL',
        url: 'http://localhost:5001',
        functions: [uploadImage, getImage, deleteImage],
        call: `// HOW TO USE
// Only ONE "return" line should be on (no // in front). Press "Send request" to run it.
// To do the next step: put // in front of the line that's on, and take the // off the next one.
// "Reset" puts this box back the way it started.

// Step 1: upload a test image. The response shows its imageID.
return uploadImage();

// Step 2: get that image back. It uses the imageID from step 1 for you.
//         You should see 200, 1200 x 800 (the full-size original).
// return getImage();

// Step 3: delete it. Then do step 2 again: it should say 404 "Image not found".
// return deleteImage();

// Error checks. Each one should come back 400 with an error message.
// return getImage('abc');                                              // ID isn't 5 digits
// return uploadImage(new File(['hello'], 'notes.txt'));                // not a JPG or PNG
// return uploadImage(new File(['not really a picture'], 'fake.png'));  // named .png but isn't an image`,
      },
      {
        title: 'CSV exporter',
        urlName: 'CSV_EXPORTER_URL',
        url: 'http://localhost:3002',
        functions: [exportCsv],
        call: `// The cases from csv-exporter/test_program.py. Uncomment one to try it.

// Story 1: records with different fields (missing ones are empty cells)
// return exportCsv({ data: [{ date: '2026-11-01', exercise: 'Squat' }, { date: '2026-11-02', notes: 'felt strong' }] });

// Story 2: choose columns and file name
// return exportCsv({ data: [{ date: '2026-11-01', exercise: 'Squat', reps: 10 }], columns: ['exercise', 'reps'], filename: 'workouts_nov.csv' });

// Story 3: commas, quotes and line breaks
// return exportCsv({ data: [{ note: 'She said "hi", then left' }, { note: 'line one\\nline two' }] });

// Story 3: nested values (dotted column, list in one cell)
// return exportCsv({ data: [{ exercise: { name: 'Squat' }, reps: [10, 8, 6] }] });

// Story 3: values that look like formulas get a ' in front
// return exportCsv({ data: [{ a: '=SUM(A1:A9)', b: '+1', c: '-cmd', d: '@x', e: 'normal', f: -5 }] });

// Story 3: body isn't valid JSON (400 INVALID_INPUT)
// return exportCsv('this is not json');

// Story 3: data is an empty list (400 EMPTY_DATA)
// return exportCsv({ data: [] });

// Story 3: data isn't a list of objects (400 INVALID_INPUT)
// return exportCsv({ data: [1, 2, 3] });

// Story 1: JSON records to CSV
return exportCsv({ data: [{ date: '2026-11-01', exercise: 'Squat', reps: 10 }, { date: '2026-11-02', exercise: 'Bench Press', reps: 8 }] });`,
      },
    ];

    // ---- Page wiring (you shouldn't need to edit below here) ----

    // Source of a function above, strip the extra tabs
    const source = fn => String(fn).replace(/^    /gm, '');

    // The code a panel starts with, and goes back to on Reset.
    const startingCode = service => [
      `const ${service.urlName} = '${service.url}';`,
      ...service.functions.map(source),
      service.call,
    ].join('\n\n');

    const AsyncFunction = (async () => {}).constructor;

    // Builds one service's panel (an accordion) and wires up its buttons.
    function addPanel(service, index) {
      const panel = document.createElement('details');
      panel.open = index === 0;
      panel.innerHTML = `
        <summary></summary>
        <div class="grid">
          <section><h6>Code <button class="secondary outline" data-action="reset" title="Go back to the starting code">Reset</button></h6><textarea data-out="code" spellcheck="false"></textarea></section>
          <section><h6>Response <span data-out="status"></span></h6><pre data-out="response">Press "Send request".</pre></section>
        </div>
        <button data-action="run">Send request</button>`;
      panel.querySelector('summary').append(service.title, ' ');
      panel.querySelector('summary').insertAdjacentHTML('beforeend', '<small><code></code></small>');
      panel.querySelector('summary code').textContent = new URL(service.url).host;

      const $ = sel => panel.querySelector(sel);
      const editor = $('[data-out="code"]');
      const status = $('[data-out="status"]');
      const response = $('[data-out="response"]');
      const reset = () => { editor.value = startingCode(service); };

      // Runs the code in the editor and shows what it returns.
      async function run() {
        status.textContent = '…';
        status.className = '';
        try {
          const result = await new AsyncFunction(editor.value)();
          if (result && typeof result === 'object' && 'status' in result && 'body' in result) {
            // the body type is the Content-Type without its "; charset=..." part
            const type = result.type ? ` · ${result.type.split(';')[0]}` : '';
            status.textContent = `${result.status}${type}`;
            status.className = result.status < 400 ? 'ok' : 'err';
            response.textContent = JSON.stringify(result.body, null, 2);
          } else {
            status.textContent = 'returned';
            response.textContent = result === undefined ? 'undefined (add a return?)' : JSON.stringify(result, null, 2);
          }
        } catch (e) {
          status.textContent = 'failed';
          status.className = 'err';
          response.textContent = e instanceof TypeError && /fetch/i.test(e.message)
            ? `${e}\n\nIs the service running (docker compose up) and does it allow CORS?`
            : `${e}`;
        }
      }

      $('[data-action="run"]').addEventListener('click', run);
      $('[data-action="reset"]').addEventListener('click', reset);
      reset();

      const main = document.querySelector('main');
      if (index > 0) main.append(document.createElement('hr'));
      main.append(panel);
    }

    SERVICES.forEach(addPanel);
  </script>
</body>
</html>
